services:
  podkladarna:
    image: ghcr.io/${GHCR_OWNER:-OWNER}/podkladarna:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podkladarna
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    network_mode: bridge
    ports:
      - "8672:8672"
    volumes:
      - ./data:/data
    environment:
      - PODKLADARNA_DATA=/data
      - MAX_CONCURRENT_LIDAR=1
      # Mapper CLI je v image (/opt/mapper); override jen při vlastním binárce:
      # PODKLADARNA_MAPPER=/opt/mapper/bin/Mapper
      # PODKLADARNA_MAPPER_EXPORT="{mapper}" --cli export --full-map -i "{omap}" -o "{png}" --dpi {dpi}
    mem_limit: 12g
