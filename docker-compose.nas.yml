# Compose pro Synology NAS – jen pull z GHCR, bez buildu
services:
  podkladarna:
    image: ghcr.io/${GHCR_OWNER}/podkladarna:${IMAGE_TAG:-latest}
    container_name: podkladarna
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    # Synology: compose bridge (podkladarna_default) často bez NAT/DNS.
    # Výchozí docker0 (bridge) má odchozí internet.
    network_mode: bridge
    ports:
      - "8672:8672"
    volumes:
      - ./data:/data
    environment:
      - PODKLADARNA_DATA=/data
      - MAX_CONCURRENT_LIDAR=1
      - JOB_RETENTION_HOURS=48
      - MAX_ACTIVE_JOBS_PER_IP=2
      - MAX_JOBS_PER_IP_HOUR=10
      - TRUST_PROXY_HEADERS=1
      # Vaše veřejná IP bez limitů (doplňte před nasazením):
      - RATE_LIMIT_EXEMPT_IPS=78.80.94.188
      # SMTP / mail – hodnoty z .env vedle compose (jinak kontejner SMTP nevidí).
      # Default = ostrý M365 relay + kibos URL (ne tajné). Override v host .env.
      # Bez SMTP_HOST selže privátní mail i POST /api/feedback (HTTP 502).
      - SMTP_HOST=${SMTP_HOST:-datais-cz.mail.protection.outlook.com}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-podkladarna@datais.cz}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-OB podklady}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://podkladarna.kibos.link}
      - PRIVATE_JOB_RETENTION_HOURS=${PRIVATE_JOB_RETENTION_HOURS:-48}
      - FEEDBACK_TO=${FEEDBACK_TO:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - MAX_FEEDBACK_PER_IP_HOUR=${MAX_FEEDBACK_PER_IP_HOUR:-5}
      # Mapper CLI je zapečený v image (PODKLADARNA_MAPPER=/opt/mapper/bin/Mapper).
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8672/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
