# Compose pro Synology NAS – jen pull z GHCR, bez buildu
services:
  podkladarna:
    image: ghcr.io/${GHCR_OWNER}/podkladarna:${IMAGE_TAG:-latest}
    container_name: podkladarna
    restart: unless-stopped
    # Synology: compose bridge (podkladarna_default) často bez NAT/DNS.
    # Výchozí docker0 (bridge) má odchozí internet.
    network_mode: bridge
    ports:
      - "8672:8672"
    volumes:
      - ./data:/data
    environment:
      - PODKLADARNA_DATA=/data
      - MAX_CONCURRENT_LIDAR=1
      - TEMP_RETENTION_DAYS=7
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8672/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
