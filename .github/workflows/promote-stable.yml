name: Promote to stable

# Povýší otestovaný image (výchozí :latest = test B) na :stable (veřejná A).
# Nic nebuilduje – jen přetaguje stejný digest. Spouští se ručně po ověření na pt.kibos.link.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Tag nebo sha image, který se stane :stable"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag source → stable
        run: |
          img="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          src="${{ inputs.source }}"
          docker buildx imagetools create -t "${img}:stable" "${img}:${src:-latest}"
          docker buildx imagetools inspect "${img}:stable"
