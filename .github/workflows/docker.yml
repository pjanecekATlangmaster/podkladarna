name: Build and push Podkladarna

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Detect app directory
        id: paths
        run: |
          if [ -f Dockerfile ]; then
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f podkladarna/Dockerfile ]; then
            echo "context=./podkladarna" >> "$GITHUB_OUTPUT"
            echo "file=./podkladarna/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile not found"; exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action normalizuje název na lowercase pro GHCR
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
