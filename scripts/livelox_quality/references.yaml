# Referenční mapy z Liveloxu pro kontrolu kvality generování po zemích / oblastech (Petr 2026-11-20).
# Ukládají se jen odkazy (classId); obrázky map stahuje fetch_ref.js do soukromé cache mimo repozitář.
# Mapy jsou autorská díla mapařů: jen interní měření, nikam je nepublikovat.
#
# id        klíč oblasti (země-oblast-druh)
# class_id  Livelox classId (https://www.livelox.com/Viewer?classId=<id>)
# kind      les | sprint (určuje metriky a preset jobu)
# map_scale měřítko jobu (sprint 4000, les 10000)
# size_km   strana čtvercového výřezu jobu kolem středu referenční mapy (km)
# terrain   typ terénu, data   výšky / kresba v Omapic (proč je oblast samostatná)
# accepted  {začátek popisu odchylky z reportu: důvod} – známé omezení dat schválené Petrem, hlásí se jen ⚪ (změna proti
#           minulému běhu se hlásí dál)
