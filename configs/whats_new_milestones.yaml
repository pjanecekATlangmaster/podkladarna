  - date: "2026-11-22"
    scope: intl
    title: "Verze 4.25 – nové oblasti (beta): USA, Nový Zéland, Portugalsko, Lichtenštejnsko, Wales, Šlesvicko-Holštýnsko a ve Španělsku Baskicko, Navarra, Katalánsko, Andalusie, Valencie a Kastilie a León; Slovinsko z novějšího LiDARu 2023–2025"
    title_en: "Version 4.25 – new areas (beta): USA, New Zealand, Portugal, Liechtenstein, Wales, Schleswig-Holstein and in Spain the Basque Country, Navarre, Catalonia, Andalusia, Valencia and Castile and León; Slovenia from newer 2023–2025 LiDAR"
