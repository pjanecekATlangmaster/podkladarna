# Ruční milníky pro box „Co je nového“.
# Jen opravdové produktové zlomy — ne každý commit.
# Generátor (scripts/generate_whats_new.py) je sloučí do whats_new.yaml.
# title_en: anglický nadpis pro anglický web (bez něj se milník v angličtině nezobrazí).
# scope: cz = jen česká verze (nabízí jen Česko), intl = jen mezinárodní doména; bez scope všude.
#   Texty bez názvu služby a bez odkazů na repozitář, musí platit pod oběma značkami (Petr 2026-11-20).
# Nadpis začíná „Verze X.Y – “ (anglicky „Version X.Y – “). PR s viditelnou změnou pro uživatele přidá záznam
#   (Petr 2026-11-23); test_whats_new.py hlídá, že nejnovější záznam není o víc než 8 minor verzí za APP_VERSION.
milestones:
  - date: "2026-11-23"
    scope: intl
    title: "Verze 4.29 – technický log průběhu mapy se na anglické stránce zobrazuje anglicky"
    title_en: "Version 4.29 – the technical log of a map build is shown in English on the English site"
  - date: "2026-11-23"
    scope: intl
    title: "Verze 4.28 – mimo Česko: pozemek obehnaný zdí se vyplní olivou jako oplocený (i ve sprintu); vrstevnice uvnitř jezer, řek a moře se nekreslí a končí na břehu; sprint nekreslí zdi a ploty uvnitř bloku budov; les a MTBO: drobné keře v otevřeném terénu už nevycházejí jako bílé tečky lesa"
    title_en: "Version 4.28 – outside Czechia: land enclosed by walls is filled olive like a fenced plot (sprint too); contours inside lakes, rivers and the sea are not drawn and end at the shore; sprint maps drop walls and fences inside building blocks; forest and MTBO: small bushes in open land no longer show up as white specks of forest"
  - date: "2026-11-23"
    title: "Verze 4.27 – les a MTBO: cesta přes most se kreslí symbolem navazující cesty a most má po obou stranách hrany 512 (i lávka); chodník na silničním mostě se nekreslí jako další čára vedle silnice"
    title_en: "Version 4.27 – forest and MTBO: a path over a bridge keeps the symbol of the adjoining path and the bridge gets edges 512 on both sides (footbridges too); a sidewalk on a road bridge is no longer drawn as an extra line beside the road"
  - date: "2026-11-23"
    scope: cz
    title: "Verze 4.26 – železnice v tunelu ze ZABAGED se už nekreslí jako trať na povrchu, ani když OSM tunel chybí nebo vede jinudy"
    title_en: "Version 4.26 – railway tunnels from ZABAGED are no longer drawn as a track on the surface, even where the OSM tunnel is missing or runs elsewhere"
  - date: "2026-11-23"
    scope: intl
    title: "Verze 4.26 – Polsko: budovy, silnice, zdi a ploty z topografické databáze BDOT10k; při výpadku výškové služby se výšky vezmou ze záložních souborů GUGiK"
