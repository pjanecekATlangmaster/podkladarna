# Ruční milníky pro box „Co je nového“.
# Jen opravdové produktové zlomy — ne každý commit.
# Generátor (scripts/generate_whats_new.py) je sloučí do whats_new.yaml.
# title_en: anglický nadpis pro anglický web (bez něj se milník v angličtině nezobrazí).
milestones:
  - date: "2026-11-08"
    title: "Verze 3.27 – referenční šablony (ortofoto, ZTM, katastr, stínování, DMP, DTM, OSM) jsou ve výchozím stavu online odkazy ve středním a maximálním zoomu: v Mapperu se stáhnou až po zapnutí a ZIP zůstane malý; volba „Stáhnout referenční šablony předem“ přibalí obrázky jako dřív včetně ortofota 12,5 cm/px (offline, OCAD)"
    title_en: "Version 3.27 – reference templates (orthophoto, base map, cadastre, hillshade, DSM, DTM, OSM) are online links in medium and maximum zoom by default: Mapper downloads them only when switched on and the ZIP stays small; “Download reference templates in advance” packs the images as before, including 12.5 cm/px orthophoto (offline, OCAD)"
  - date: "2026-11-06"
    title: "Verze 3.24 – sprint kreslí herní prvky na dětských hřištích (531 ×): z OSM a kde OSM nic nemá, z výšky nad terénem (body DMP OK 0,5 m) a vrženého stínu na ortofotu 0,125 m; malé hřiště jeden křížek, větší křížky aspoň 4 mm od sebe; soukromá hřiště (zahrady, access=private) se vynechávají"
    title_en: "Version 3.24 – sprint maps draw playground equipment (531 ×): from OSM and, where OSM has nothing, from the height above ground (DMP OK 0.5 m points) and the shadow on the 0.125 m orthophoto; a small playground gets one cross, larger ones crosses at least 4 mm apart; private playgrounds are skipped"
  - date: "2026-11-06"
    title: "Verze 3.21 – sprint: samostatný strom na náměstí, pěší zóně nebo parkovišti se kreslí bodem 417 ve středu koruny (z výšky porostu DMP OK, potvrzené ortofotem)"
    title_en: "Version 3.21 – sprint: a single tree on a square, pedestrian zone or car park is drawn as point 417 at the crown centre (from DMP OK canopy height, confirmed by the orthophoto)"
  - date: "2026-11-06"
    title: "Verze 3.19 – sprint má ve výchozím stavu drobné objekty z OSM: lavičky a stoly, rozcestníky, pomníky, boží muka, kříže, sochy a památné stromy; stejné značky se nelepí na sebe, pamětní desky na zdech se nekreslí"
    title_en: "Version 3.19 – sprint includes small OSM objects by default: benches and tables, signposts, monuments, wayside shrines, crosses, statues and memorial trees; identical symbols do not overlap, plaques on walls are not drawn"
  - date: "2026-11-06"
    title: "Verze 3.18 – kresba z DTM je výchozí pro všechny mapy (sprint, les i MTBO); kde DTM není, kreslí se z OSM a ZABAGED"
    title_en: "Version 3.18 – drawing from the DTM is the default for all maps (sprint, forest and MTBO); where there is no DTM, OSM and ZABAGED are used"
  - date: "2026-11-06"
    title: "Verze 3.17 – les a MTBO: ulice se stáním jako jedna plocha jen tam, kde stání ulici v měřítku opravdu rozšiřuje (aspoň 0,3 mm na 5 mm délky); s DTM se nově kreslí i stání, které DTM vede jako parkoviště"
    title_en: "Version 3.17 – forest and MTBO: a street with parking is one area only where the parking really widens the street at map scale (at least 0.3 mm over 5 mm of length); with DTM, parking recorded as a car park is now drawn too"
  - date: "2026-11-05"
    title: "Verze 3.16 – mezi referenčními šablonami (v ZIPu i v Mapperu) bezoblačné družicové snímky Sentinel-2 s datem snímku (nejnovější a po 3 měsících za poslední půlrok), ukážou změny po ortofotu: paseky, polomy, nové stavby"
    title_en: "Version 3.16 – cloud-free Sentinel-2 satellite images with the image date among the reference templates (latest and every 3 months over the last half year) show changes since the orthophoto: clearings, windthrow, new buildings"
  - date: "2026-11-05"
    title: "Verze 3.15 – menší výřezy: sprint 1:4 000 nejvýš 4 km² (2 × 2 km), les nejvýš 15 km², MTBO dál 25 km²"
    title_en: "Version 3.15 – smaller areas: sprint 1:4 000 at most 4 km² (2 × 2 km), forest at most 15 km², MTBO still 25 km²"
  - date: "2026-11-03"
    title: "Verze 3.12 – upozornění, když byl povrch korun (DMP OK) nalétán v bezlistém období: listnaté porosty pak v mapě chybí nebo vycházejí jako drsný terén 403"
    title_en: "Version 3.12 – a warning when the canopy surface (DMP OK) was flown in the leaf-off season: deciduous stands are then missing from the map or come out as rough open 403"
  - date: "2026-11-02"
    title: "Verze 3.12 – MTBO i v měřítku 1:7 500"
    title_en: "Version 3.12 – MTBO also at 1:7 500"
  - date: "2026-11-02"
    title: "Verze 3.12 – přehlednější web: typ mapy a souhrn nastavení, průběh jobu, Moje mapy i pro soukromé joby, statistiky zpracování a tlačítko „Načíst zadání do nové mapy“"
    title_en: "Version 3.12 – clearer website: map type and settings summary, job progress, My maps also for private jobs, processing statistics and a “Load settings into a new map” button"
  - date: "2026-11-02"
    title: "Verze 3.8 – vrstevnice s adaptivním vyhlazením jako výchozí: plynulejší v mírném terénu a v zástavbě, drobné tvary zůstávají"
    title_en: "Version 3.8 – contours with adaptive smoothing by default: smoother on gentle terrain and in built-up areas, small landforms stay"
  - date: "2026-11-02"
    title: "Verze 3.7 – menší a rychlejší .omap: tvary objektů zjednodušené jako Ctrl+M v Mapperu (0,1 mm), les zhruba o třetinu menší soubor"
    title_en: "Version 3.7 – smaller and faster .omap: object shapes simplified like Ctrl+M in Mapper (0.1 mm), forest files about a third smaller"
  - date: "2026-11-02"
    title: "Verze 3.6 – typ mapy lze zvolit zvlášť: jen les, jen MTBO, nebo obojí; ploty a zdi z OSM se kreslí vždy, drobné objekty OSM (lavičky, lampy, herní prvky) jednou volbou"
    title_en: "Version 3.6 – choose the map type separately: forest only, MTBO only, or both; fences and walls from OSM are always drawn, small OSM objects (benches, lamps, playground equipment) with one option"
  - date: "2026-11-02"
    title: "Verze 3.12 – les a MTBO: čistší napojení silnic na zpevněné plochy a parkoviště, budovy, oliva a ploty nezasahují do kresby silnic, stání u ulice kreslí čára silnice"
    title_en: "Version 3.12 – forest and MTBO: cleaner connection of roads to paved areas and car parks; buildings, olive green and fences no longer overlap roads; street parking is covered by the road line"
  - date: "2026-11-02"
    title: "Verze 3.8 – srozumitelné chybové hlášky; soukromý job pošle e-mail i když skončí chybou"
    title_en: "Version 3.8 – clearer error messages; a private job sends an e-mail even when it fails"
  - date: "2026-10-31"
    title: "Verze 3.4 – ortofoto se do ZIPu nepřibaluje (velikost), v Mapperu ho připojte jako WMS ČÚZK"
    title_en: "Version 3.4 – the orthophoto is no longer packed into the ZIP (size); add it in Mapper as the ČÚZK WMS"
  - date: "2026-10-29"
    title: "Verze 3.3 – les a MTBO: louky a paseky (louka 401, drsný terén 403) a zeleň 408 podle ortofota"
    title_en: "Version 3.3 – forest and MTBO: meadows and clearings (open land 401, rough open 403) and green 408 based on the orthophoto"
  - date: "2026-10-29"
    title: "Verze 3.2 – výběr území nejvýš 25 km², sprint 1:4 000 nejvýš 9 km², aby se job vešel do časového limitu"
    title_en: "Version 3.2 – area at most 25 km², sprint 1:4 000 at most 9 km², so the job fits within the time limit"
  - date: "2026-10-29"
    title: "Verze 3.2 – kratší job: podklady se stahují souběžně, rychlejší skládání mapy (sprint výrazně), odhad času podle skutečně sestavovaných map"
    title_en: "Version 3.2 – shorter jobs: data downloaded in parallel, faster map assembly (much faster for sprint), time estimate based on the maps actually built"
  - date: "2026-10-29"
    title: "Verze 3.1 – hranice porostů v lese a MTBO hladké bez posunu (nový výchozí stupeň 1), stupeň 0 = přesné kostičky z rastru"
    title_en: "Version 3.1 – vegetation boundaries in forest and MTBO smooth without shifting (new default level 1), level 0 = exact raster squares"
  - date: "2026-10-28"
    title: "Verze 3.0 – pozor: barvy vegetace jsou výška a hustota porostu z DMP OK (povrch korun), ne průběžnost; hranice porostů berte jako náčrt, ne hotovou kresbu"
    title_en: "Version 3.0 – note: vegetation colours show canopy height and density from DMP OK (canopy surface), not runnability; treat vegetation boundaries as a sketch, not finished drawing"
  - date: "2026-10-28"
    title: "Verze 3.0 – les a MTBO: silnice jedním symbolem po celém úseku (šířka z DTM), čisté napojení v křižovatkách, rozdělená vozovka jednou osou, bez zbytečných ramp a pahýlů"
    title_en: "Version 3.0 – forest and MTBO: one road symbol along the whole section (width from DTM), clean junctions, dual carriageway as one axis, no needless ramps and stubs"
  - date: "2026-10-28"
    title: "Verze 3.0 – les a MTBO: zpevněné plochy (parkoviště, pěší zóny, okolí silnic) jako jedna síť s okrajem, generalizované podle měřítka; chodníky u silnic se nekreslí, když nejsou čitelné"
    title_en: "Version 3.0 – forest and MTBO: paved areas (car parks, pedestrian zones, road surroundings) as one network with an edge, generalised by scale; sidewalks along roads are not drawn when not legible"
  - date: "2026-10-28"
    title: "Verze 3.0 – volba „DTM“: sprint kreslí z Digitální technické mapy (budovy, ploty, chodníky, schody, parkoviště) ve všech krajích; les a MTBO ji mohou zapnout, bez DTM se kreslí plnohodnotně z OSM + ZABAGED"
    title_en: "Version 3.0 – “DTM” option: sprint draws from the Digital Technical Map (buildings, fences, sidewalks, stairs, car parks) in all regions; forest and MTBO can switch it on, without DTM they are drawn fully from OSM + ZABAGED"
  - date: "2026-10-28"
    title: "Verze 3.0 – sprint: domy sloučené do bloků, dvůr uzavřený budovami je budova (ISSprOM 521), ulice historických center z katastru, srázy jen se skutečným skokem, kryté průchody domem"
    title_en: "Version 3.0 – sprint: houses merged into blocks, a courtyard closed by buildings is a building (ISSprOM 521), streets of historic centres from the cadastre, banks only with a real step, covered passages through houses"
  - date: "2026-10-28"
    title: "Verze 3.0 – les a MTBO: jisté balvany z výškového modelu, srázy a budovy odsunuté od cest, malé budovy bodem, ploty spojené a natočené k olivě"
    title_en: "Version 3.0 – forest and MTBO: reliable boulders from the elevation model, banks and buildings moved away from paths, small buildings as points, fences joined and turned towards olive green"
  - date: "2026-10-16"
    title: "MTBO mapy ve skutečné OCAD sadě ISMTBOM 2022 s českými názvy symbolů"
    title_en: "MTBO maps in the real OCAD ISMTBOM 2022 symbol set"
  - date: "2026-10-15"
    title: "České sady symbolů ISOM a ISSprOM podle OCAD a jednotné číslování symbolů"
    title_en: "ISOM and ISSprOM symbol sets following OCAD, with unified symbol numbering"
  - date: "2026-10-07"
    title: "Velké výřezy už nepadají (LiDAR se zpracovává proudově); opakovaný výřez téhož území téměř bez čekání díky cache"
    title_en: "Large areas no longer fail (LiDAR is processed as a stream); repeating the same area is almost instant thanks to the cache"
  - date: "2026-10-03"
    title: "Webový náhled mapy přes OpenOrienteering Mapper"
    title_en: "Web preview of the map via OpenOrienteering Mapper"
  - date: "2026-10-02"
    title: "Konec Karttapullautinu — vlastní vegetace, srázy a DEM"
    title_en: "Goodbye Karttapullautin — our own vegetation, banks and DEM"
