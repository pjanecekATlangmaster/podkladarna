  - 'opencode: formát přechází na JVF DTM 1.5.0.2 (nasazení 18. 11. 2026, odstávka 12.–18. 11. 2026).'
  - 'opencode: Komerční užití veřejné části doloženo odpovědí MSK dle § 4b zákona 200/1994 Sb. – https://www.msk.cz/assets/urad/povinne_informace/odpoved-anonym_3.pdf'

