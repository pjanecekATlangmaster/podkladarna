# Registr zdrojů dat po zemích (Petr 2026-11-16). Jediné místo pro přehled: země, druh dat, server, licence,
# přístup a známé problémy. Aplikace ho za běhu nečte; adresy serverů dál žijí v kódu (moduly v `code`).
# Dokument docs/zdroje-dat.md se generuje: `python scripts/data_sources_doc.py` (test hlídá, že sedí).
# tests/test_data_sources.py hlídá i to, že každá země z countries.yaml, každý zdroj výšek / technické mapy
# (`provider_key`) a každá sonda stavu zdrojů (`probe`, app/source_status.py) tu má záznam.
#
# Pole záznamu:
#   id         jednoznačný klíč (malá písmena)
#   countries  kódy zemí z countries.yaml, `*` = všude
#   kinds      elevation (DTM/DSM rastr) | point_cloud (LiDAR mračno) | canopy (výška porostu) | technical_map
#              (obdoba české DTM: budovy, vozovky, chodníky, ploty) | vectors (topografické vektory) | buildings
#              | orthophoto | map (podkladová mapa) | cadastre | hillshade | imagery (družicové snímky)
#   name, provider (poskytovatel), url (server / služba, kterou kód volá), info (stránka produktu nebo licence)
#   role       kresba | výšky | šablona | sonda – k čemu ho Podkladárna používá
#   status     used (napojeno) | candidate (zjištěno, nenapojeno) | off (napojeno, vypnuto) | rejected (nevhodné)
#   code       kde je v kódu (u used / off)
#   provider_key klíč `elevation` / `technical_map` v countries.yaml (jen u zdrojů, které ho mají)
#   probe      klíč nebo seznam klíčů sond v app/source_status.py (hlídání výpadků)
#   license    class public (otevřená, i komerčně) | restricted (podmínky, poplatek, smlouva, NC) | unknown;
#              name, url, attribution (požadovaná citace)
#   access     free (bez registrace) | email (výdej na e-mail) | api_key | account | contract (smlouva / poplatek)
#   checked    datum a jak byla licence ověřena; „neověřeno“ = převzato z podkladů, na stránce poskytovatele
#              neověřeno
#   issues     známé problémy (nestabilita, odstávky, hustota bodů, velké soubory, nejasná licence, chyby v datech)

