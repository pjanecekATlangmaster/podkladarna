# Registr zdrojů dat po zemích (Petr 2026-11-16). Jediné místo pro přehled: země, druh dat, server, licence,
# přístup a známé problémy. Aplikace z něj za běhu čte jen `reference_keys` a `image_in_zip`; adresy serverů dál žijí v kódu (moduly v `code`).
# Dokument docs/zdroje-dat.md se generuje: `python scripts/data_sources_doc.py` (test hlídá, že sedí).
# tests/test_data_sources.py hlídá i to, že každá země z countries.yaml, každý zdroj výšek / technické mapy
# (`provider_key`) a každá sonda stavu zdrojů (`probe`, app/source_status.py) tu má záznam.
#
# Pole záznamu:
#   id         jednoznačný klíč (malá písmena)
#   countries  kódy zemí z countries.yaml, `*` = všude
#   kinds      elevation (DTM/DSM rastr) | point_cloud (LiDAR mračno) | canopy (výška porostu) | technical_map
#              (obdoba české DTM: budovy, vozovky, chodníky, ploty) | vectors (topografické vektory) | buildings
#              | orthophoto | map (podkladová mapa) | cadastre | hillshade | imagery (družicové snímky)
#   name, provider (poskytovatel), url (server / služba, kterou kód volá), info (stránka produktu nebo licence)
#   role       kresba | výšky | šablona | sonda – k čemu ho Podkladárna používá
#   reference_keys  klíče podkladů (built_refs, fnmatch; `online_*` = online šablona / stažený rastr), které ze zdroje
#              vznikají – jen u zdrojů obrázků v references/ ZIPu
#   image_in_zip  allowed | forbidden | unclear – smí obrázek zdroje do ZIPu (Petr 2026-11-16: povoleno všude, kde to
#              licence výslovně nezakazuje; forbidden = obrázek se nepřibalí, ZIP dostane vysvětlení, online šablona
#              zůstává; unclear = zatím přibalit a zeptat se Petra). Aplikace tato pole čte (app/pipeline/zip_images.py).
#   image_in_zip_note  proč (interní poznámka)
#   zip_notice  u forbidden: texty vysvětlení v ZIPu (cs / en: name, why, online = jak si podklad načíst sám)
#   status     used (napojeno) | candidate (zjištěno, nenapojeno) | off (napojeno, vypnuto) | rejected (nevhodné)
#   code       kde je v kódu (u used / off)
#   provider_key klíč `elevation` / `technical_map` v countries.yaml (jen u zdrojů, které ho mají)
#   probe      klíč nebo seznam klíčů sond v app/source_status.py (hlídání výpadků)
#   license    class public (otevřená, i komerčně) | restricted (podmínky, poplatek, smlouva, NC) | unknown;
#              name, url, attribution (požadovaná citace)
#   access     free (bez registrace) | email (výdej na e-mail) | api_key | account | contract (smlouva / poplatek)
#   checked    datum a jak byla licence ověřena; „neověřeno“ = převzato z podkladů, na stránce poskytovatele
#              neověřeno
#   issues     známé problémy (nestabilita, odstávky, hustota bodů, velké soubory, nejasná licence, chyby v datech)

sources:
# ----------------------------------------------------------------------------------------------- všude
- id: osm_overpass
  countries: ["*"]
  kinds: [vectors, buildings]
  name: OpenStreetMap přes Overpass API (6 zrcadel, záloha OSM API /map)
  provider: OpenStreetMap contributors; zrcadla overpass-api.de, overpass.openstreetmap.fr, maps.mail.ru, private.coffee
  url: https://overpass-api.de/api/interpreter
  info: https://www.openstreetmap.org/copyright
  role: kresba
  status: used
  code: app/pipeline/osm_paths.py (OVERPASS_URLS, OSM_API_MAP_URL)
  probe: osm
  license:
    class: public
    name: ODbL 1.0
    url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors"
  access: free
  checked: "2026-11-16 overpass-api.de (limity); ODbL podle osm.org/copyright"
  issues:
    - "Veřejná instance overpass-api.de žádá nejvýš ~10 000 dotazů a ~1 GB za den; při růstu provozu vlastní instance nebo placené zrcadlo (PODKLADARNA_OVERPASS_URLS)."
    - "Zrcadla jsou nestabilní: maps.mail.ru 38 s nebo 504, private.coffee a kumi.systems vracely 500 (komentář v osm_paths.py)."
    - "Záloha OSM API /map (api.openstreetmap.org) je určená hlavně pro editory; podmínky API usage policy pro čtení dat ověřit."
    - "ODbL: prodávaný .omap je odvozená databáze, kupující ji smí šířit dál (evropa-data-prehled kap. 5)."
    - "Kvalita a úplnost OSM se liší po zemích i obcích (moře jen jako pobřežní čára, zahrady, hřiště bez surface)."

- id: osm_tiles
  countries:
  - '*'
  kinds:
  - map
  name: Dlaždice OSM (openstreetmap.fr, .org, .de) a OSM WMS terrestris
  provider: OSM France, OSMF, FOSSGIS, terrestris
  url: https://a.tile.openstreetmap.fr/osmfr/
  info: https://www.openstreetmap.fr/usage/
  role: šablona
  reference_keys: ["online_osm*"]
  image_in_zip: forbidden
  image_in_zip_note: "Obrázek z dlaždic do ZIPu ne (Petr 2026-11-16): OSM France povoluje dlaždice jen pro weby bez zisku, tile policy OSMF zakazuje offline archivy, terrestris WMS má od ~1:25 000 vodoznak a nemá závazné podmínky. Od 3.60.0 je osm.png vlastní render z dat OSM (osm_render), dlaždice se do ZIPu nestahují; online šablona osm.vrt v .omap zůstává jen bez staženého osm.png (načítá zobrazené dlaždice)."
  # Obrázek tohoto zdroje nahrazuje osm.png z osm_render – ZIP proto vysvětlení o chybějícím obrázku nedostává.
  zip_replaced_by: osm_render
  zip_notice:
    cs:
      name: Obrázek OpenStreetMap (osm.png)
      why: Provozovatelé dlaždic OSM to nedovolují – OSM France jen pro weby bez zisku, OpenStreetMap Foundation zakazuje offline archivy dlaždic, záložní WMS terrestris nemá podmínky pro další šíření.
      online: V .omap je online šablona „OpenStreetMap“ (references/osm.vrt); mapu najdete i na https://www.openstreetmap.org. Data OSM jsou pod licencí ODbL a jsou v ZIPu ve složce osm/.
    en:
      name: OpenStreetMap image (osm.png)
      why: The OSM tile providers do not allow it – OSM France only for non-profit websites, the OpenStreetMap Foundation forbids offline archives of its tiles, the terrestris WMS fallback has no terms for redistribution.
      online: The .omap contains the online template “OpenStreetMap” (references/osm.vrt); the map is also at https://www.openstreetmap.org. The OSM data are licensed under the ODbL and included in the osm/ folder of the ZIP.
  status: used
  code: app/pipeline/reference_layers.py (OSM_XYZ_URLS, OSM_WMS), app/pipeline/online_templates.py, app/tiles.py
  license:
    class: restricted
    name: data ODbL, dlaždice podle podmínek provozovatele
    url: https://www.openstreetmap.fr/usage/
    attribution: '© OpenStreetMap contributors (terrestris: © OpenStreetMap contributors, © Natural Earth Data, © GEBCO, ©
      terrestris)'
  access: free
  checked: '2026-11-16 tile policy OSMF; podmínky OSM France (volně s citací, mírný provoz) a FAQ openstreetmap.de (odkaz
    na pravidla OSMF); terrestris produktová stránka (závazné podmínky nenalezeny) · Claude 2026-11-16 openstreetmap.fr/usage
    (jen weby bez zisku, služba může být bez varování vypnuta), tile policy OSMF (zákaz offline), terrestris.de (zdarma vodoznak
    od ~1:25 000) · opencode (osm_tiles): 2026-11-16 openstreetmap.fr/usage („site sans but lucratif“), operations.osmfoundation.org/policies/tiles
    (kap. 4 offline), terrestris.de/produkte/freier-osm-wms – Claude neověřil'
  issues:
  - Tile policy OSMF zakazuje na tile.openstreetmap.org předstahování a offline použití. Od 3.60.0 se dlaždice do ZIPu nestahují
    vůbec (osm.png kreslí osm_render z dat OSM); tile.openstreetmap.org, .de a webová cache /tiles se do ZIPu nepoužívají.
    Webová mapa (/tiles, prohlížeč) a online šablona .omap stahují jen zobrazené dlaždice – dovoleno.
  - Vyžaduje vlastní User-Agent (generické knihovny blokuje).
  - openstreetmap.de občas vrací 404 na okrajové dlaždice (GDAL padá) – komentář v kódu.
  - 'Claude 2026-11-16: OSM France povoluje volné použití jen pro veřejné weby bez zisku s mírným provozem; u komerčních tolerují
    jen velmi malé objemy. Pro prodávanou mapu (osm.png v ZIPu od 3.56.17) nevyhovuje – náhrada: vlastní render z dat OSM
    jobu (Overpass), komerční poskytovatel s licencí pro offline obrázek, nebo jen online šablona. terrestris zdarma má od
    ~1:25 000 vodoznak.'
  - 'opencode: OSM France dlaždice jsou licenčně NEPOUŽITELNÉ pro prodávaný produkt; vyřadit openstreetmap.fr i tile.openstreetmap.org
    z offline větve ZIPu, nasadit vlastní/komerční tile server.'
  - 'opencode: terrestris free WMS je jen do ~1:25 000, bez SLA, „Geeignet für produktive Geschäftsanwendungen: Eingeschränkt“;
    chyběla v registru závazná podmínka.'
  - 'opencode: OSMF vyžaduje platný User-Agent, Referer, cache ≥7 dní; komerčním službám může být přístup odebrán.'

