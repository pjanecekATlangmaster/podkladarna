- id: osm_overpass
  countries: ["*"]
  kinds: [vectors, buildings]
  name: OpenStreetMap přes Overpass API (6 zrcadel, záloha OSM API /map)
  provider: OpenStreetMap contributors; zrcadla overpass-api.de, overpass.openstreetmap.fr, maps.mail.ru, private.coffee
  url: https://overpass-api.de/api/interpreter
  info: https://www.openstreetmap.org/copyright
  role: kresba
  status: used
  code: app/pipeline/osm_paths.py (OVERPASS_URLS, OSM_API_MAP_URL)
  probe: osm
  license:
    class: public
    name: ODbL 1.0
    url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors"
  access: free
  checked: "2026-11-16 overpass-api.de (limity); ODbL podle osm.org/copyright"
  issues:
    - "Veřejná instance overpass-api.de žádá nejvýš ~10 000 dotazů a ~1 GB za den; při růstu provozu vlastní instance nebo placené zrcadlo (PODKLADARNA_OVERPASS_URLS)."
    - "Zrcadla jsou nestabilní: maps.mail.ru 38 s nebo 504, private.coffee a kumi.systems vracely 500 (komentář v osm_paths.py)."
    - "Záloha OSM API /map (api.openstreetmap.org) je určená hlavně pro editory; podmínky API usage policy pro čtení dat ověřit."
    - "ODbL: prodávaný .omap je odvozená databáze, kupující ji smí šířit dál (evropa-data-prehled kap. 5)."
    - "Kvalita a úplnost OSM se liší po zemích i obcích (moře jen jako pobřežní čára, zahrady, hřiště bez surface)."

