  - 'DMR 5G má hustotu ~0,5 m mezi body: drobné balvany a skalky pod ~1 m nevyčteme.'
  - Listy jsou velké, proto cache listů se stropem LIDAR_CACHE_MAX_GB a kontrolou neúplného LAZ (3.9.0, 3.56.1).
  - DMP OK je z obrazové korelace (bez prostupnosti porostu jako u mračna z laseru).
  - opencode uvádí url https://atom.cuzk.gov.cz/ (kód volá https://openzu.cuzk.gov.cz/opendata/).
  - 'opencode: citace „Data ČÚZK – CC BY 4.0“ je špatně; závazný formát je „ČÚZK, [rok]“, šířit jen s metadaty a označením
    úpravy. Stejná oprava platí pro cz_zabaged, cz_ruian, cz_ortofoto, cz_cuzk_wms.'
  - 'opencode: openzu.cuzk.gov.cz/opendata/ vrací z cloudu 403; oficiální strojová distribuce je ATOM/Geoprohlížeč https://ags.cuzk.gov.cz/opendata.'
  - 'opencode: DMP OK JE klasifikované bodové mračno (třídy 1/2/5/6/7/9/17), jen z obrazové korelace (bez prostupnosti pod
    koruny); není to „slabý rastr“. DMP 1G končí 1. 1. 2027.'

