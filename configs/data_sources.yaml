  checked: '2026-11-16 stránka ČÚZK Otevřená data · Claude 2026-11-16 podmínky ČÚZK (citace „ČÚZK, [rok]“, popis úprav, metadata,
    CC BY 4.0) · opencode (cz_openzu_lidar): 2026-11-16 načteny Podmínky poskytování prostorových dat ČÚZK; atom.cuzk.gov.cz
    200 – Claude neověřil'
