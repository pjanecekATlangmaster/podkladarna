# contour_interval is metres on the ground. ini_builder converts it for
# Karttapullautin (interval is multiplied by scalefactor; formline=0 draws
# every half-interval line as a full contour).
# OOM vrstevnice (GDAL) vždy plná ekvidistance + indexcontours (bez 103 formline);
# formline v presetu ovlivňuje jen KP rastrový náhled.
sprint_2m:
  label: "Sprint 1:4000 · 2 m"
  group: Sprint
  contour_interval: 2
  indexcontours: 10
  basemapinterval: 0.5
  scalefactor: 0.4
  formline: 0
  smoothing: 0.85
  processes: 2
  vectorconf: zabaged.txt
  # ISSprOM 2019-2 symbol 521: black outline, black 50% fill
  buildingcolor: "128,128,128"

sprint_2_5m:
  label: "Sprint 1:4000 · 2,5 m"
  group: Sprint
  contour_interval: 2.5
  indexcontours: 12.5
  basemapinterval: 0.625
  scalefactor: 0.4
  formline: 0
  smoothing: 0.85
  processes: 2
  vectorconf: zabaged.txt
  buildingcolor: "128,128,128"

