# Podporované země (návrh /mnt/project-files/evropa-data/pohranicni-mapa-navrh.md).
# status: live (lze vybrat) | beta (jen s COUNTRIES_BETA, na testu B výchozí `*`, a jen na doméně se zemí v SITES – nikdy na české `:CZ`) | off.
# citation / attribution: citace zdrojů podle licencí místních dat (README, CO_JE_PODKLADARNA, .omap).
# Zahraniční mapy dělá mezinárodní verze Omapic: citace a attribution anglicky; citace „Base map: Omapic · …, [year]“ (jako anglická licence).
# elevation: zdroj výšek (cz_openzu | sk_ugkk | nl_ahn | ch_swisstopo | at_bev | de_berlin | de_nrw | pl_gugik | gb_ea | de_by | de_st | de_mv | de_ni | de_bb | de_rp | de_bw | dk_dhm | no_hoyde | si_arso | gb_sct | gb_wls | es_nav | es_pv | de_sh | fr_lidarhd | lu_act | us_3dep | sk_ugkk_local | local:<složka v DATA_ROOT> | none); cz_sources: české vektory a podklady (ZABAGED, RÚIAN, DTM …).
# technical_map: obdoba české DTM pro kresbu (cz_dtm | nl_bgt | ch_av | at_fmzk | de_sb | fr_pdv | none) – budovy, silnice, chodníky, parkoviště, ploty.
# Povolené území požadavku = země domény (SITES, `*` = všechny) ∩ země se status live; bez SITES jen CZ.
# technical_map_gaps: polygon částí země bez technické mapy (kreslí se tam jen z OSM; mapa v GUI je odliší barvou).
# technical_map_area: naopak polygon jediného území s technickou mapou (FR = Paříž); výřez mimo něj ji nestahuje.
# boundary: zjednodušený polygon hranice (WGS84, lehce rozšířený, aby výřez u hranice neodpadl na toleranci).
# green: zeleň v lese (points = hustota bodů z mračna, CZ výchozí | laser = zrnitost z laserového povrchu, jinde výchozí | photo = povrch ze snímků, jen základní; mapa v GUI šrafuje | leafoff = zimní laser bez listí, bez zrnitosti, v lese z OSM bílý les | understory = horský les, zeleň z podílu nízkého patra místo zrnitosti | plain = jen základní zeleň z výšky porostu bez zrnitosti, sever).
# contour_smooth: výchozí vyhlazení vrstevnic, když job nechá volbu „podle země“ (1 adaptivní – výchozí, 0 méně vyhlazení).
# contour_formlines: výchozí pomocné vrstevnice 103 při volbě „podle země“ (off – výchozí | sparse | more | all; sever more).
# terrain_vectors: terénní prvky z národní topografické databáze nad OSM (fi_mtk = Maastotietokanta).
# elevation_years: roky snímkování výšek (text do upozornění před buildem); data_notes: důsledky dat ukázané před buildem,
#   v logu, README a poznámce .omap (old = data starší ~10 let, coarse = terén hrubší než 1 m; photo plyne z green) – app/data_notes.py.
#   Uvádět jen tam, kde to opravdu mění kresbu; Česko žádné.
# view: výchozí pohled mapy [jih, západ, sever, východ]; crs: CRS jobu (UTM-NAD83 = NAD83 / UTM zóna středu výřezu, USA).
